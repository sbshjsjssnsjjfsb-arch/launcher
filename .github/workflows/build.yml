name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - AmazorLauncher.zip
      - .github/workflows/build.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project
        run: unzip -q AmazorLauncher.zip
      - name: Point launcher to launcher.json in this repo
        run: |
          sed -i "s|http://10.0.2.2:8080/launcher.json|https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/launcher.json|" AmazorLauncher/app/src/main/java/com/myproject/launcher/AppConfig.kt
      - name: Build debug APK
        working-directory: AmazorLauncher
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-debug-apk
          path: AmazorLauncher/app/build/outputs/apk/debug/*.apk
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp AmazorLauncher/app/build/outputs/apk/debug/*.apk AmazorRP.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest AmazorRP.apk --title "Amazor RP" --notes "Последняя сборка"
